services:
  - type: web
    name: hakim-wellness-api
    env: node
    region: oregon
    plan: free
    buildCommand: "npm install --omit=dev"
    startCommand: "node server.js"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: FRONTEND_URL
        sync: false
